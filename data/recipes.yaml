# AisleMeal 食谱库 —— 完整一餐（1 人份，克数一律为生重/购买态）
# 步骤为参考做法，发布前建议实做抽验（未验证）。编码阶段不得修改克数与步骤内容。
# equipment 为所需设备（AND）；空数组 = 无需烹饪。

recipes:
  # ============ 早餐（8 道） ============
  - id: oat-yogurt-cup
    name: 燕麦酸奶能量杯
    mealSlots: [breakfast]
    equipment: []
    timeMinutes: 5
    difficulty: 1
    ingredients:
      - { id: oats, grams: 40 }
      - { id: greek-yogurt, grams: 150 }
      - { id: banana, grams: 95 }
    steps:
      - 燕麦片 40g 倒入碗中，加希腊酸奶 150g 拌匀
      - 香蕉 95g 切片铺在上面
      - 直接吃（想更软可冷藏隔夜）
    tags: [免开火, 快手, 高蛋白]

  - id: pb-banana-toast
    name: 花生酱香蕉吐司配牛奶
    mealSlots: [breakfast]
    equipment: []
    timeMinutes: 5
    difficulty: 1
    ingredients:
      - { id: wholewheat-bread, grams: 80 }
      - { id: peanut-butter, grams: 15 }
      - { id: banana, grams: 80 }
      - { id: skim-milk, grams: 250 }
    steps:
      - 两片全麦面包各抹一层花生酱（共 15g）
      - 香蕉切片夹进面包里
      - 配一盒脱脂牛奶 250ml
    tags: [免开火, 快手]

  - id: protein-oat-shake
    name: 蛋白粉燕麦香蕉奶昔
    mealSlots: [breakfast]
    equipment: []
    timeMinutes: 5
    difficulty: 1
    ingredients:
      - { id: whey-protein, grams: 30 }
      - { id: oats, grams: 30 }
      - { id: skim-milk, grams: 250 }
      - { id: banana, grams: 80 }
    steps:
      - 摇摇杯中倒入脱脂牛奶 250ml
      - 加入蛋白粉 30g、即食燕麦 30g
      - 香蕉掰小块放入，盖紧摇匀（有搅拌机更顺滑）
    tags: [免开火, 快手, 高蛋白]

  - id: microwave-egg-oatmeal
    name: 微波鸡蛋牛奶燕麦粥
    mealSlots: [breakfast]
    equipment: [microwave]
    timeMinutes: 6
    difficulty: 1
    ingredients:
      - { id: oats, grams: 40 }
      - { id: egg, grams: 60 }
      - { id: greek-yogurt, grams: 200 }
    steps:
      - 大碗中倒入燕麦 40g 和牛奶 200ml，微波高火 2 分钟
      - 取出后立刻打入 1 个鸡蛋，快速搅散
      - 再微波高火 1 分钟，拌匀即可
    tags: [快手, 暖胃]

  - id: microwave-steamed-egg-toast
    name: 微波水蒸蛋配全麦吐司
    mealSlots: [breakfast]
    equipment: [microwave]
    timeMinutes: 8
    difficulty: 1
    ingredients:
      - { id: egg, grams: 120 }
      - { id: wholewheat-bread, grams: 80 }
      - { id: scallion, grams: 5 }
      - { id: salt, grams: 1 }
    steps:
      - 2 个鸡蛋打散，加 180ml 温水和 1g 盐搅匀
      - 盖上保鲜膜，用牙签扎几个小孔
      - 微波中火（50%）加热 5 分钟至凝固
      - 撒葱花，配两片全麦面包
    tags: [高蛋白, 暖胃]

  - id: tomato-egg-sandwich
    name: 番茄炒蛋三明治
    mealSlots: [breakfast]
    equipment: [stove]
    timeMinutes: 10
    difficulty: 1
    ingredients:
      - { id: egg, grams: 120 }
      - { id: wholewheat-bread, grams: 80 }
      - { id: tomato, grams: 80 }
      - { id: lettuce, grams: 20 }
      - { id: olive-oil, grams: 3 }
    steps:
      - 番茄切小丁，2 个鸡蛋打散
      - 锅中放 3g 橄榄油，倒入蛋液炒到半凝固
      - 加番茄丁翻炒 1 分钟至软
      - 夹进两片全麦面包，垫上生菜
    tags: [快手, 经典]

  - id: boiled-egg-oat-bowl
    name: 水煮蛋燕麦牛奶碗
    mealSlots: [breakfast]
    equipment: [stove]
    timeMinutes: 12
    difficulty: 1
    ingredients:
      - { id: egg, grams: 120 }
      - { id: oats, grams: 40 }
      - { id: skim-milk, grams: 250 }
    steps:
      - 鸡蛋冷水下锅，水开后煮 8 分钟捞出剥壳
      - 燕麦 40g 加牛奶 250ml 泡 3 分钟（喜热可微波 1 分钟）
      - 鸡蛋对半切开摆上即可
    tags: [高蛋白, 极简]

  - id: tuna-lettuce-sandwich
    name: 金枪鱼生菜三明治
    mealSlots: [breakfast]
    equipment: []
    timeMinutes: 6
    difficulty: 1
    ingredients:
      - { id: canned-tuna, grams: 70 }
      - { id: wholewheat-bread, grams: 80 }
      - { id: lettuce, grams: 30 }
      - { id: tomato, grams: 50 }
      - { id: greek-yogurt, grams: 20 }
    steps:
      - 金枪鱼罐头沥干水分，加 20g 希腊酸奶拌成鱼酱（代替蛋黄酱，更低脂）
      - 番茄切片，生菜洗净沥干
      - 面包夹入生菜、番茄和金枪鱼酱
    tags: [免开火, 高蛋白, 清爽]

  - id: tomato-egg-yogurt-bowl
    name: 番茄鸡蛋酸奶碗
    mealSlots: [breakfast]
    equipment: [stove]
    timeMinutes: 8
    difficulty: 1
    ingredients:
      - { id: egg, grams: 120 }
      - { id: tomato, grams: 80 }
      - { id: greek-yogurt, grams: 150 }
    steps:
      - 鸡蛋炒熟，番茄切丁翻炒 1 分钟
      - 盛出放凉，旁边摆希腊酸奶
    tags: [快手, 高蛋白]

  - id: banana-egg-oat-bowl
    name: 香蕉鸡蛋燕麦碗
    mealSlots: [breakfast]
    equipment: []
    timeMinutes: 5
    difficulty: 1
    ingredients:
      - { id: egg, grams: 60 }
      - { id: banana, grams: 95 }
      - { id: oats, grams: 35 }
      - { id: greek-yogurt, grams: 80 }
    steps:
      - 燕麦拌酸奶
      - 鸡蛋可提前煮好对半，香蕉切片铺上
    tags: [免开火, 高蛋白]

  - id: broccoli-egg-yogurt
    name: 西兰花鸡蛋酸奶早餐
    mealSlots: [breakfast]
    equipment: [microwave]
    timeMinutes: 8
    difficulty: 1
    ingredients:
      - { id: egg, grams: 120 }
      - { id: broccoli, grams: 80 }
      - { id: greek-yogurt, grams: 120 }
      - { id: olive-oil, grams: 3 }
    steps:
      - 西兰花加少许水微波 3 分钟
      - 鸡蛋打散微波 1 分钟至凝固，淋橄榄油
      - 配希腊酸奶
    tags: [快手, 有蔬菜]

  # ============ 午餐 / 晚餐 ============
  - id: airfryer-chicken-rice
    name: 空气炸锅鸡胸能量餐
    mealSlots: [lunch, dinner]
    equipment: [airfryer, ricecooker]
    timeMinutes: 25
    difficulty: 2
    ingredients:
      - { id: chicken-breast, grams: 150 }
      - { id: brown-rice, grams: 60 }
      - { id: broccoli, grams: 150 }
      - { id: olive-oil, grams: 5 }
      - { id: salt, grams: 2 }
      - { id: black-pepper, grams: 1 }
    steps:
      - 糙米 60g（生米）洗净，按 1:1.3 加水用电饭煲煮饭
      - 鸡胸肉两面抹盐、黑胡椒和橄榄油，静置 10 分钟
      - 放入空气炸锅 180°C 烤 12 分钟，中途翻面一次
      - 西兰花掰小朵，最后 5 分钟放进炸锅一起烤
      - 鸡胸切条，和饭、西兰花装盘
    tags: [高蛋白, 减脂经典]

  - id: ricecooker-chicken-mushroom-rice
    name: 电饭煲鸡腿香菇焖饭
    mealSlots: [lunch, dinner]
    equipment: [ricecooker]
    timeMinutes: 45
    difficulty: 1
    ingredients:
      - { id: chicken-thigh, grams: 120 }
      - { id: white-rice, grams: 70 }
      - { id: mushroom, grams: 50 }
      - { id: carrot, grams: 50 }
      - { id: soy-sauce, grams: 8 }
      - { id: ginger, grams: 3 }
    steps:
      - 鸡腿肉切块，用生抽 8g 和姜丝抓匀腌 10 分钟
      - 大米 70g 洗净放电饭煲，正常煮饭水量
      - 口蘑切片、胡萝卜切丁，和鸡腿一起平铺在米上
      - 按正常煮饭键，跳闸后拌匀焖 5 分钟
    tags: [一锅出, 零失败]

  - id: garlic-shrimp-pasta
    name: 蒜香虾仁西葫芦意面
    mealSlots: [lunch, dinner]
    equipment: [stove]
    timeMinutes: 20
    difficulty: 2
    ingredients:
      - { id: shrimp, grams: 150 }
      - { id: wholewheat-pasta, grams: 70 }
      - { id: zucchini, grams: 100 }
      - { id: garlic, grams: 10 }
      - { id: olive-oil, grams: 8 }
      - { id: salt, grams: 2 }
    steps:
      - 全麦意面 70g 下沸水煮 10 分钟，捞出备用
      - 锅中放橄榄油 8g，小火爆香蒜末
      - 加虾仁炒至变红，再加西葫芦片炒 2 分钟
      - 倒入意面和 2 勺煮面水，加盐翻拌 1 分钟
    tags: [高蛋白, 低脂]

  - id: salmon-quinoa-bowl
    name: 香煎三文鱼藜麦碗
    mealSlots: [lunch, dinner]
    equipment: [stove, ricecooker]
    timeMinutes: 30
    difficulty: 2
    ingredients:
      - { id: salmon, grams: 120 }
      - { id: quinoa, grams: 50 }
      - { id: asparagus, grams: 100 }
      - { id: bell-pepper, grams: 50 }
      - { id: olive-oil, grams: 3 }
      - { id: salt, grams: 2 }
    steps:
      - 藜麦 50g 洗净，按 1:1.5 加水用电饭煲煮熟
      - 三文鱼两面撒盐，静置 5 分钟
      - 平底锅放 3g 油，三文鱼皮朝下中火煎 3 分钟，翻面再煎 2 分钟
      - 芦笋和彩椒条用锅中余油煎 2 分钟
      - 全部铺在藜麦上装碗
    tags: [优质脂肪, 增肌]

  - id: tomato-beef-rice
    name: 番茄嫩牛肉盖饭
    mealSlots: [lunch, dinner]
    equipment: [stove, ricecooker]
    timeMinutes: 25
    difficulty: 2
    ingredients:
      - { id: beef-tenderloin, grams: 100 }
      - { id: tomato, grams: 150 }
      - { id: white-rice, grams: 70 }
      - { id: onion, grams: 30 }
      - { id: olive-oil, grams: 5 }
      - { id: soy-sauce, grams: 5 }
      - { id: salt, grams: 1 }
    steps:
      - 大米 70g 电饭煲正常煮饭；牛里脊逆纹切薄片，用生抽抓匀腌 10 分钟
      - 锅中放油，牛肉大火快炒 1 分钟至变色盛出
      - 用余油把洋葱丝和番茄块炒出汁，加盐
      - 牛肉回锅拌匀，整锅盖在米饭上
    tags: [高蛋白, 下饭]

  - id: microwave-cod-sweetpotato
    name: 微波清蒸鳕鱼红薯餐
    mealSlots: [lunch, dinner]
    equipment: [microwave]
    timeMinutes: 15
    difficulty: 1
    ingredients:
      - { id: cod, grams: 150 }
      - { id: sweet-potato, grams: 200 }
      - { id: broccoli, grams: 100 }
      - { id: soy-sauce, grams: 5 }
      - { id: ginger, grams: 3 }
      - { id: sesame-oil, grams: 3 }
    steps:
      - 红薯洗净扎几个孔，微波高火 6 分钟至软
      - 鳕鱼放深盘，铺姜丝，盖保鲜膜扎孔，微波高火 4 分钟
      - 西兰花加 2 勺水盖膜，微波高火 3 分钟
      - 鳕鱼淋生抽和香油，配红薯和西兰花
    tags: [低脂, 快手, 一台微波炉搞定]

  - id: pork-pepper-rice
    name: 猪里脊炒彩椒盖饭
    mealSlots: [lunch, dinner]
    equipment: [stove, ricecooker]
    timeMinutes: 25
    difficulty: 2
    ingredients:
      - { id: pork-loin, grams: 100 }
      - { id: bell-pepper, grams: 100 }
      - { id: white-rice, grams: 70 }
      - { id: garlic, grams: 5 }
      - { id: olive-oil, grams: 5 }
      - { id: soy-sauce, grams: 5 }
      - { id: cooking-wine, grams: 5 }
    steps:
      - 大米 70g 电饭煲煮饭；里脊切丝，用料酒和生抽腌 10 分钟
      - 锅中放油爆香蒜片，肉丝大火炒 2 分钟至变色
      - 加彩椒丝再炒 1 分钟，出锅盖饭
    tags: [快手, 下饭]

  - id: tomato-tofu-egg-soup-rice
    name: 番茄豆腐蛋花汤配糙米饭
    mealSlots: [lunch, dinner]
    equipment: [stove, ricecooker]
    timeMinutes: 25
    difficulty: 1
    ingredients:
      - { id: broccoli, grams: 200 }
      - { id: egg, grams: 60 }
      - { id: tomato, grams: 150 }
      - { id: brown-rice, grams: 60 }
      - { id: olive-oil, grams: 3 }
      - { id: salt, grams: 2 }
      - { id: scallion, grams: 5 }
    steps:
      - 糙米 60g 电饭煲煮饭（水 1:1.3）
      - 番茄切块下锅，加少许水煮出汁
      - 豆腐切块入锅煮 3 分钟，加盐
      - 淋入打散的蛋液搅出蛋花，关火滴香油撒葱花
      - 汤配饭吃
    tags: [清淡, 暖胃, 素食友好]

  - id: airfryer-sweetpotato-chicken-salad
    name: 空气炸锅红薯鸡胸沙拉
    mealSlots: [lunch, dinner]
    equipment: [airfryer]
    timeMinutes: 25
    difficulty: 1
    ingredients:
      - { id: chicken-breast, grams: 130 }
      - { id: sweet-potato, grams: 150 }
      - { id: lettuce, grams: 80 }
      - { id: cucumber, grams: 50 }
      - { id: olive-oil, grams: 5 }
      - { id: black-pepper, grams: 1 }
      - { id: salt, grams: 2 }
    steps:
      - 红薯切 2cm 小块，鸡胸抹盐和黑胡椒
      - 一起放空气炸锅 180°C 烤 15 分钟（红薯翻一次面）
      - 生菜撕块、黄瓜切片垫底
      - 鸡胸切条摆上，淋橄榄油拌匀
    tags: [减脂经典, 无米饭]

  - id: chicken-soba-cold-noodle
    name: 鸡丝荞麦凉面
    mealSlots: [lunch, dinner]
    equipment: [stove]
    timeMinutes: 20
    difficulty: 2
    ingredients:
      - { id: chicken-breast, grams: 100 }
      - { id: buckwheat-noodle, grams: 70 }
      - { id: cucumber, grams: 80 }
      - { id: sesame-oil, grams: 5 }
      - { id: soy-sauce, grams: 8 }
      - { id: garlic, grams: 5 }
    steps:
      - 鸡胸冷水下锅煮 12 分钟，捞出放凉后撕成丝
      - 荞麦面煮 5 分钟，过两遍凉水沥干
      - 黄瓜切丝，蒜切末
      - 全部拌入生抽和香油
    tags: [清爽, 夏日, 高蛋白]

  - id: shrimp-egg-fried-rice
    name: 虾仁鸡蛋糙米炒饭
    mealSlots: [lunch, dinner]
    equipment: [stove, ricecooker]
    timeMinutes: 20
    difficulty: 2
    ingredients:
      - { id: shrimp, grams: 100 }
      - { id: egg, grams: 60 }
      - { id: brown-rice, grams: 60 }
      - { id: carrot, grams: 30 }
      - { id: scallion, grams: 10 }
      - { id: olive-oil, grams: 8 }
      - { id: salt, grams: 2 }
    steps:
      - 糙米 60g 提前用电饭煲煮熟晾凉（隔夜饭更佳）
      - 锅中放一半油，炒散蛋液盛出
      - 剩余油炒虾仁和胡萝卜丁 2 分钟
      - 倒入米饭炒散，加盐、鸡蛋和葱花翻匀
    tags: [一碗端, 下饭]

  - id: ricecooker-salmon-veg-rice
    name: 电饭煲三文鱼杂蔬焖饭
    mealSlots: [lunch, dinner]
    equipment: [ricecooker]
    timeMinutes: 45
    difficulty: 1
    ingredients:
      - { id: salmon, grams: 100 }
      - { id: white-rice, grams: 70 }
      - { id: carrot, grams: 50 }
      - { id: mushroom, grams: 50 }
      - { id: soy-sauce, grams: 5 }
    steps:
      - 大米 70g 洗净放电饭煲，正常水量
      - 三文鱼切块、胡萝卜切丁、口蘑切片铺在米上
      - 按煮饭键，跳闸后淋生抽拌匀焖 5 分钟
    tags: [一锅出, 零失败, 优质脂肪]

  - id: pepper-beef-asparagus-rice
    name: 黑椒牛柳芦笋配米饭
    mealSlots: [lunch, dinner]
    equipment: [stove, ricecooker]
    timeMinutes: 25
    difficulty: 2
    ingredients:
      - { id: beef-tenderloin, grams: 120 }
      - { id: asparagus, grams: 100 }
      - { id: white-rice, grams: 70 }
      - { id: olive-oil, grams: 5 }
      - { id: black-pepper, grams: 2 }
      - { id: oyster-sauce, grams: 5 }
      - { id: cooking-wine, grams: 5 }
    steps:
      - 大米 70g 电饭煲煮饭；牛柳切条用料酒和蚝油腌 10 分钟
      - 芦笋切段焯水 1 分钟捞出
      - 锅中放油，牛柳大火炒 1 分钟
      - 加芦笋和现磨黑胡椒炒 30 秒出锅
    tags: [高蛋白, 增肌]

  - id: microwave-chicken-broccoli-box
    name: 微波鸡胸西兰花玉米便当
    mealSlots: [lunch, dinner]
    equipment: [microwave]
    timeMinutes: 15
    difficulty: 1
    ingredients:
      - { id: chicken-breast, grams: 130 }
      - { id: broccoli, grams: 150 }
      - { id: brown-rice, grams: 150 }
      - { id: olive-oil, grams: 3 }
      - { id: salt, grams: 2 }
      - { id: black-pepper, grams: 1 }
    steps:
      - 鸡胸切 1cm 薄片，抹盐、黑胡椒和橄榄油
      - 深盘铺鸡胸，盖保鲜膜扎孔，微波高火 4 分钟
      - 西兰花和玉米段加 2 勺水，盖膜再微波 4 分钟
      - 全部装盒即可（适合上班带饭）
    tags: [带饭, 快手, 一台微波炉搞定]

  - id: tofu-cabbage-rice
    name: 蚝油豆腐娃娃菜配米饭
    mealSlots: [lunch, dinner]
    equipment: [stove, ricecooker]
    timeMinutes: 25
    difficulty: 1
    ingredients:
      - { id: firm-tofu, grams: 200 }
      - { id: baby-cabbage, grams: 150 }
      - { id: white-rice, grams: 60 }
      - { id: garlic, grams: 5 }
      - { id: olive-oil, grams: 5 }
      - { id: oyster-sauce, grams: 8 }
    steps:
      - 大米 60g 电饭煲煮饭
